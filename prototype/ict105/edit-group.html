      CREATE GROUP PAGE
==========================-->

<section class="create-group-page">

    <div class="page-header">

        <span class="page-badge">
            <i class="fa-solid fa-users"></i>
            Smart Study Group
        </span>

        <h1>Edit Study Group</h1>

        <p>
            Fill in the information below to create a new study group and invite your classmates.
        </p>

    </div>

    <div class="create-card">

        <h2>Group Information</h2>

        <form class="create-form" id="editGroupForm">

            <!-- Group Name -->

            <div class="input-group">

                <label>Group Name</label>

                <div class="input-box">

                    <i class="fa-solid fa-users"></i>

                    <input type="text" id="groupName"
                        placeholder="Programming Study Group"
                        required>

                </div>

            </div>

            <!-- Course Code -->

            <div class="input-group">

                <label>Course Code</label>

                <div class="input-box">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <select id="courseCode"></select>

                </div>

            </div>

            <!-- Subject -->

            <div class="input-group">

                <label>Subject</label>

                <div class="input-box">

                    <i class="fa-solid fa-book"></i>

                    <select id="subject" onchange="loadCourseCodes()"  required>


                    </select>

                </div>

            </div>

            <!-- Study Mode -->

            <div class="input-group">

                <label>Study Mode</label>

                <div class="input-box">

                    <i class="fa-solid fa-laptop"></i>

                    <select id="studyMode" required>

                        <option value="">Select Study Mode</option>

                        <option>Online</option>

                        <option>On Campus</option>

                        <option>Hybrid</option>

                    </select>

                </div>

            </div>

            <!-- Skill Level -->

            <div class="input-group">

                <label>Skill Level</label>

                <div class="input-box">

                    <i class="fa-solid fa-chart-line"></i>

                    <select id="skillLevel" required>

                        <option value="">Select Skill Level</option>

                        <option>Beginner</option>

                        <option>Intermediate</option>

                        <option>Advanced</option>

                    </select>

                </div>

            </div>

            <!-- Preferred Year -->

            <div class="input-group">

                <label>Preferred Student Year</label>

                <div class="input-box">

                    <i class="fa-solid fa-user-graduate"></i>

                    <select id="preferredYear">

                        <option>All Years</option>

                        <option>Year 1</option>

                        <option>Year 2</option>

                        <option>Year 3</option>

                        <option>Year 4</option>

                    </select>

                </div>

            </div>

            <!-- Meeting Date -->

            <div class="input-group">

                <label>Meeting Date</label>

                <div class="input-box">

                    <i class="fa-regular fa-calendar"></i>

                    <input type="date" id="meetingDate" required>

                </div>

            </div>

            <!-- Meeting Time -->

            <div class="input-group">

                <label>Meeting Time</label>

                <div class="input-box">

                    <i class="fa-regular fa-clock"></i>

                    <input type="time" id="meetingTime" required>

                </div>

            </div>

            <!-- Meeting Location -->

            <div class="input-group">

                <label>Meeting Location</label>

                <div class="input-box">

                    <i class="fa-solid fa-location-dot"></i>

                    <input type="text" id="location"
                        placeholder="Computer Lab A"
                        required>

                </div>

            </div>

            <!-- Maximum Members -->

            <div class="input-group">

                <label>Maximum Members</label>

                <div class="input-box">

                    <i class="fa-solid fa-user-group"></i>

                    <input type="number" id="maxMembers"
                        min="2"
                        max="50"
                        placeholder="30"
                        required>

                </div>

            </div>

            <!-- Meeting Frequency -->

            <div class="input-group">

                <label>Meeting Frequency</label>

                <div class="input-box">

                    <i class="fa-solid fa-repeat"></i>

                    <select id="frequency">

                        <option>Weekly</option>

                        <option>Twice a Week</option>

                        <option>Monthly</option>

                        <option>Flexible</option>

                    </select>

                </div>

            </div>

            <!-- Privacy -->

            <div class="input-group">

                <label>Group Privacy</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <select id="privacy">

                        <option>Public Group</option>

                        <option>Private (Approval Required)</option>

                    </select>

                </div>

            </div>

            <!-- Description -->

            <div class="input-group full-width">

                <label>Description</label>

                <textarea rows="5" id="description"
                    placeholder="Describe your study group..."></textarea>

            </div>

            <!-- Rules -->

            <div class="input-group full-width">

                <label>Group Rules</label>

                <textarea rows="4" id="rules"
                    placeholder="Example: Respect everyone, arrive on time, participate actively."></textarea>

            </div>

            <!-- Agreement -->

            <div class="checkbox-group full-width">

                <input type="checkbox" id="agree" required>

                <label>

                    I confirm that all information provided is accurate and I agree to the community guidelines.

                </label>

            </div>

            <!-- Buttons -->

            <div class="button-group full-width">

                <button type="submit"
                    class="primary-btn">

                    <i class="fa-solid fa-pen-to-square"></i>

                    Update Group

                </button>

                <a href="find-group.html"
                    class="secondary-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</section>
