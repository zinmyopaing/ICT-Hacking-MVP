</head>

<!-- ==========================
        REGISTER SECTION
=========================== -->

          <section class="register-page">

          <div class="register-container">

          <!-- Left -->

          <div class="register-left">

          <img src="../images/register_image.jpg"

          alt="Register Illustration">

          </div>

          <!-- Right -->

          <div class="register-right">

          <div class="register-card">

          <h2>

          Create Account

          </h2>

          <p>

          Join Smart Study Group Finder today.

          </p>

          <form id="registerForm">

          <div class="input-group">

          <label>

          Full Name

          </label>

          <div class="input-box">

          <i class="fa-solid fa-user"></i>

          <input id="fullName"   

          type="text"

          placeholder="Enter your full name"

          required>

          </div>

          </div>

          <div class="input-group">

          <label>

          Student ID

          </label>

          <div class="input-box">

          <i class="fa-solid fa-id-card"></i>

          <input id="studentId" 

          type="text"

          placeholder="Enter Student ID"

          required>

          </div>

          </div>

          <div class="input-group">

          <label>

          University Email

          </label>

          <div class="input-box">

          <i class="fa-solid fa-envelope"></i>

          <input id="email" 

          type="email"

          placeholder="example@gmail.com or 123456@rsu.ac.th"

          required>

          </div>

          </div>

          <div class="input-group">

          <label>

          Password

          </label>

          <div class="input-box">

          <i class="fa-solid fa-lock"></i>

          <input 

          type="password"

          id="password"

          placeholder="Create password"

          required>

          <i class="fa-solid fa-eye"

          id="toggleRegisterPassword">

          </i>

          </div>

          </div>

          <div class="input-group">

          <label>

          Confirm Password

          </label>

          <div class="input-box">

          <i class="fa-solid fa-lock"></i>

          <input

          type="password"

          id="confirmPassword"

          placeholder="Confirm password"

          required>

          <i class="fa-solid fa-eye"

          id="toggleConfirmPassword">

          </i>

          </div>

          </div>

          <button

          type="submit"

          class="register-submit">

          Create Account

          </button>

          <div class="login-link">

          Already have an account?

          <a href="login.html">

          Login

          </a>

          </div>

          </form>

          <p id="registerMessage" class="message"></p>

          </div>

          </div>

          </div>

          </section>

           <script src="../js/database.js"></script>
            <script src="../js/register.js"></script>   

          </body>

          </html>
